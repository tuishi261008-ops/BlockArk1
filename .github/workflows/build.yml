name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle -p BlockArk assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: BlockArk/app/build/outputs/apk/debug/app-debug.apk
